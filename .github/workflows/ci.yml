# CI — the safety net that replaces human code review (HANDOFF NFR-12).
# Runs on every push to main and every pull request:
#   rust   — format, lints, tests on Windows + Linux; checks generated TS bindings
#   ui     — lint, format, typecheck, tests, production build
#   bundle — builds installers (Windows .exe, Linux .deb/.AppImage) and attaches
#            them to the run, so anyone can download and try a change
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (WebKitGTK for Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (also regenerates TypeScript bindings)
        run: cargo test --workspace

      - name: Generated TypeScript bindings are committed
        if: runner.os == 'Linux'
        shell: bash
        run: |
          changes="$(git status --porcelain -- apps/desktop/src/shared/ipc/generated)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::TypeScript bindings are out of date. Run 'cargo test --workspace' and commit apps/desktop/src/shared/ipc/generated."
            exit 1
          fi

  ui:
    name: UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint + format + typecheck + tests
        run: pnpm check
      - name: Production build
        run: pnpm build:ui

  bundle:
    name: Installer (${{ matrix.os }})
    needs: [rust, ui]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (WebKitGTK for Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ScrollRecord-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
