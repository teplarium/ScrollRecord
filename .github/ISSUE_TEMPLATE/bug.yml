name: Bug report
description: Something in the app doesn't work or shows an error.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! No technical knowledge needed. Just describe what you saw.
        If you got an error code like `SR-0101`, check [ERRORS.md](https://github.com/teplarium/ScrollRecord/blob/main/docs/ERRORS.md) first, it may already explain the fix.
  - type: input
    id: code
    attributes:
      label: Error code (if any)
      placeholder: SR-0001
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see? A screenshot helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Click "New project"
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: Copy the bottom line of the app window (e.g. "v0.1.0 · core 0.1.0 · windows x86_64"), or the output of `scrollrecord info`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: |
        Attach the latest log file, or paste the end of it.
        Windows: `%LOCALAPPDATA%\io.github.teplarium.scrollrecord\logs\`
        Linux: `~/.local/share/io.github.teplarium.scrollrecord/logs/`
