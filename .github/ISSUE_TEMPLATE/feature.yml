name: Feature request
description: Suggest something new or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the goal or the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could ScrollRecord help?
  - type: textarea
    id: extra
    attributes:
      label: Examples, references, mock-ups (optional)
